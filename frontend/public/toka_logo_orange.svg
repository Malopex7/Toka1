      <stop offset="0%" stop-color="#FF5C00" />
      <stop offset="100%" stop-color="#FF3800" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF4F00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Group: Toka Orange Emblem -->
  <g transform="translate(10, 6)">
    <!-- Small Left Leaf -->
    <path 
      d="M 45 32 C 34 26 26 12 36 6 C 45 0 54 12 51 26 C 49 30 46 32 45 32 Z" 
